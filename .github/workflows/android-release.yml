name: Android release APK

# Riders and suppliers in Davao sideload this file, so every build that reaches
# them must be a real signed release pointed at the deployed API — not a debug
# artifact, and not one that quietly points at loopback.
#
# A manual dispatch with play_bundle builds a Google Play App Bundle (AAB)
# instead, as an Actions artifact for the captain to upload to Play Console by
# hand. That run never touches the APK path: no APK, no landing-site upload,
# no GitHub Release, no release push. See README.md "Google Play bundle".
#
# submit_to_play, together with play_bundle, also hands that verified AAB to
# EAS Submit for Google Play's internal testing track (eas.json). Builds stay
# here with the upload key; EAS only uploads. Never production, never a
# promotion: the captain promotes by hand in Play Console.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish a GitHub Release for this build
        type: boolean
        default: false
      play_bundle:
        description: >-
          Build a signed Google Play bundle (AAB) as an Actions artifact instead
          of the APK. Publishes nothing, and ignores publish_release.
        type: boolean
        default: false
      submit_to_play:
        description: >-
          With play_bundle only: also upload the verified AAB to Google Play's
          internal testing track with EAS Submit. Ignored without play_bundle.
        type: boolean
        default: false

# A release build takes ~20 minutes; never run two for the same ref.
# A Play bundle run gets its own group, so it never cancels a main release.
concurrency:
  group: android-apk-${{ github.ref }}${{ github.event.inputs.play_bundle == 'true' && '-play' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Config and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check release announcement delivery
        run: node --test scripts/announce-release.test.mjs

      - name: Check the Play release notes
        run: node --test scripts/play-release-notes.test.mjs

      # The only check that resolves every config plugin out of node_modules.
      # Metro never reads expo.plugins and neither does jest, which is how a
      # stale plugin entry once shipped a launch crash past a green suite.
      - name: Resolve the public app config
        run: npx expo config --type public > /dev/null

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

  apk:
    name: ${{ github.event.inputs.play_bundle == 'true' && 'Signed Play bundle (AAB)' || 'Signed release APK' }}
    # A pull request gets the checks above and nothing else. No secrets are
    # referenced on that path, so no signing key is decoded and no artifact
    # exists that anyone could mistake for a shipped build.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    env:
      # Stamps the version a rider reads on the phone — see app.config.ts.
      # Also the Play versionCode: every run of this workflow, APK or AAB, has
      # a higher run number than the runs before it, and Play only accepts a
      # versionCode above every one it has seen. Re-running a run keeps its
      # number, so a re-run's AAB cannot be uploaded over the original's.
      GRIDGO_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the Android build
        run: |
          set -euo pipefail
          df -h /
          # GitHub-hosted images ship .NET, Haskell, CodeQL, extra NDKs and
          # leftover Docker layers. An Expo release Gradle run fills the disk
          # without this: 2026-08-28 client/supplier/rider all died mid-build
          # with "No space left on device".
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/ndk-bundle
          sudo apt-get clean
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Deliberately no gradle cache: the injected signing properties live
          # in ~/.gradle, and a cache step would upload them out of the job.

      - run: npm ci

      - name: Resolve the public app config
        id: config
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/app.config.json"
          version="$(node -p "require('$RUNNER_TEMP/app.config.json').version")"
          code="$(node -p "require('$RUNNER_TEMP/app.config.json').android.versionCode")"
          package="$(node -p "require('$RUNNER_TEMP/app.config.json').android.package")"
          stem="gridgo-rider-$version-${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "code=$code"
            echo "package=$package"
            echo "stem=$stem"
            echo "apk=$stem.apk"
            echo "aab=$stem.aab"
          } >> "$GITHUB_OUTPUT"
          echo "GRIDGO Rider $version (versionCode $code)"

      # The captain's Firebase config for ph.gridgo.rider (project
      # gridgo-c2ce9), which is what registers this build with FCM. It is
      # deliberately not in the repository — .gitignore keeps it out — so it
      # arrives here as a secret and is written outside the workspace, where no
      # artifact upload of a repo path can sweep it up. app.config.ts reads
      # GOOGLE_SERVICES_JSON.
      #
      # Missing is a hard failure, not a fallback: an APK built without it
      # installs, signs in, and silently never receives an alert — the exact
      # failure nobody reports because nothing looks wrong.
      - name: Stage the Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set; the APK would ship without push"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          # Prove it is the config for this app before a 20-minute build, not
          # after: a client or supplier file would prebuild happily and then
          # never receive anything addressed to ph.gridgo.rider.
          node -e '
            const c = require(process.env.RUNNER_TEMP + "/google-services.json");
            const pkgs = c.client.map((x) => x.client_info.android_client_info.package_name);
            if (!pkgs.includes("ph.gridgo.rider")) {
              console.error("::error::google-services.json has no entry for ph.gridgo.rider");
              process.exit(1);
            }
            console.log("Firebase project " + c.project_info.project_id + " covers " + pkgs.join(", "));
          '
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      # Generated at build time rather than committed: .gitignore already keeps
      # /android out of the repo, and a checked-in copy drifts silently from
      # app.json on every Expo upgrade. The cost is that config correctness has
      # to hold, which is what the step above enforces before the long build.
      - name: Generate the android project
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
        run: npx expo prebuild --platform android --clean --no-install

      # Expo regenerates android/gradle.properties from its template on every
      # --clean prebuild, with org.gradle.jvmargs=-Xmx2048m. A release assemble
      # of this app (Hermes, native debug metadata, ART profiles, lint-vital)
      # now needs more than 2 GiB; ubuntu-latest has 16 GiB, so 6g is safe.
      - name: Give the Gradle daemon enough heap
        run: |
          set -euo pipefail
          props=android/gradle.properties
          if ! grep -q '^org.gradle.jvmargs=' "$props"; then
            echo "::error::$props has no org.gradle.jvmargs= line to replace"
            exit 1
          fi
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8|' "$props"
          grep '^org.gradle.jvmargs=' "$props"

      - name: Stage the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          # Outside the workspace, so nothing can commit it and no artifact
          # upload of a repo path can sweep it up.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore"
            exit 1
          fi
          # AGP's injected signing config, in a properties file rather than on
          # the gradle command line, which would put the password in the
          # process list. Store and key password are the same key material.
          mkdir -p "$HOME/.gradle"
          {
            printf 'android.injected.signing.store.file=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'android.injected.signing.store.password=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'android.injected.signing.key.alias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'android.injected.signing.key.password=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > "$HOME/.gradle/gradle.properties"

      - name: Build the release APK
        if: github.event.inputs.play_bundle != 'true'
        working-directory: android
        env:
          # The load-bearing line of this whole workflow. EXPO_PUBLIC_* values
          # are inlined by Babel while *this* command bundles the JS, not read
          # at runtime. Set anywhere else — a later step, the runner env after
          # the fact — and the app falls back to the loopback base in
          # lib/api.ts or throws before Clerk can render: green in CI, dead on
          # every real phone.
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "::error::EXPO_PUBLIC_API_URL is not set for the build step"
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_CARTO_API_KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_CARTO_API_KEY is not set for the build step"
            exit 1
          fi
          case "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" in
            pk_live_*) ;;
            *) echo "::error::release builds require a Clerk pk_live_* publishable key"; exit 1 ;;
          esac
          ./gradlew assembleRelease --no-daemon

      # The Play bundle: same injected upload key, same public configuration,
      # plus EXPO_PUBLIC_APP_DISTRIBUTION=play, which turns off the update
      # prompt, the "Update completed" sheet and the release push's side-load
      # download link (lib/buildDistribution.ts). Play policy forbids an app
      # installed from Play offering an APK from anywhere else. Inlined at
      # bundle time like the rest, so it belongs on this step and no other.
      - name: Build the Play bundle
        if: github.event.inputs.play_bundle == 'true'
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
          EXPO_PUBLIC_APP_DISTRIBUTION: play
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "::error::EXPO_PUBLIC_API_URL is not set for the build step"
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_CARTO_API_KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_CARTO_API_KEY is not set for the build step"
            exit 1
          fi
          case "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" in
            pk_live_*) ;;
            *) echo "::error::release builds require a Clerk pk_live_* publishable key"; exit 1 ;;
          esac
          ./gradlew bundleRelease --no-daemon

      - name: Verify signature and baked-in public config
        if: github.event.inputs.play_bundle != 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
        run: scripts/verify-release-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Verify the Play bundle's signature and baked-in public config
        if: github.event.inputs.play_bundle == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
        run: scripts/verify-release-apk.sh android/app/build/outputs/bundle/release/app-release.aab

      - name: Name the build
        if: github.event.inputs.play_bundle != 'true'
        id: apk
        env:
          VERSION: ${{ steps.config.outputs.version }}
          APK: ${{ steps.config.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$APK"
          size="$(du -h "$RUNNER_TEMP/out/$APK" | cut -f1)"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          {
            echo "### GRIDGO Rider $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$APK\` |"
            echo "| Size | $size |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Signature | release key, verified against the keystore alias |"
            echo "| Public config | deployed API and Clerk values verified inside the bundle |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The landing site serves this file to riders and suppliers, so only a
      # merge to the default branch may replace it. Not a pull request, and not
      # a manual dispatch from a branch — either would put unreviewed code on
      # the public download.
      #
      # The deploy key carries a forced command server-side; `upload-apk rider`
      # arrives as SSH_ORIGINAL_COMMAND. The server validates the bytes are a
      # real APK, stores it as gridgo-rider.apk and writes a sha256 sidecar.
      #
      # Runs before upload-artifact: Actions storage quota filling that step
      # must not leave https://gridgo.talasora.com/download on a stale APK.
      - name: Publish the APK to the captain's server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APK: ${{ steps.config.outputs.apk }}
        run: |
          set -euo pipefail
          missing=""
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            # Loud, not skipped: a silent no-op here leaves the landing site
            # serving an older APK with nobody aware it went stale.
            echo "::error::missing repository secret(s):$missing"
            exit 1
          fi

          umask 077
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"

          apk="$RUNNER_TEMP/out/$APK"
          # StrictHostKeyChecking against the pinned known_hosts: an unknown
          # host is a failed upload, never a prompt or a blind trust.
          response="$(ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'upload-apk rider' < "$apk")"
          printf '%s\n' "$response"

          # If the server echoes the digest it stored, it has to be the file we
          # built — a truncated upload that still exits 0 would otherwise serve
          # a broken APK to every rider who downloads it.
          local_sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "built sha256: $local_sha"
          remote_sha="$(printf '%s' "$response" | grep -oiE '[0-9a-f]{64}' | head -1 || true)"
          if [ -n "$remote_sha" ] && [ "$(printf '%s' "$remote_sha" | tr 'A-F' 'a-f')" != "$local_sha" ]; then
            echo "::error::the server stored a different file than this build produced"
            exit 1
          fi

          echo "| Published | \`gridgo-rider.apk\` on the captain's server |" >> "$GITHUB_STEP_SUMMARY"

      # Only the default branch names a release. A build from anywhere else is
      # downloadable as a run artifact and nothing more. This step uses the
      # on-disk APK, so it must run before upload-artifact: a full Actions
      # storage quota fails that step and would otherwise skip the Release.
      #
      # After the landing upload, never before it: the in-app update prompt
      # reads GitHub's latest release but "Update now" downloads from the
      # landing site, so a release published first (or one whose upload then
      # failed) offers build N to phones while serving N-1 — they reinstall
      # the same build and are offered it again. Only a push to main uploads,
      # so only that run may mark its release latest; a manual dispatch with
      # publish_release still gets a release, but no phone is offered it.
      # Never for a Play bundle run: its build is not the side-load APK, and a
      # release would offer it to every side-loaded phone.
      - name: Publish the GitHub Release
        if: (github.ref == 'refs/heads/main' || github.event.inputs.publish_release == 'true') && github.event.inputs.play_bundle != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
          APK: ${{ steps.config.outputs.apk }}
          SIZE: ${{ steps.apk.outputs.size }}
          LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          notes="$(printf '%s\n' \
            "Signed release APK for sideloading ($SIZE). Install it on the phone directly." \
            "" \
            "Commit \`${GITHUB_SHA::7}\`, build $GITHUB_RUN_NUMBER." \
            "Verified in CI: signed with the release key, and deployed API and Clerk values are inlined in the JS bundle.")"
          gh release create "v$VERSION" "$RUNNER_TEMP/out/$APK" \
            --target "$GITHUB_SHA" \
            --title "GRIDGO Rider $VERSION" \
            --notes "$notes" \
            --latest="$LATEST"

      - name: Broadcast the app release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          RELEASE_ANNOUNCE_TOKEN: ${{ secrets.RELEASE_ANNOUNCE_TOKEN }}
          RELEASE_APP: rider
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
        run: node scripts/announce-release.mjs

      # Best-effort CI convenience. Quota-full here used to skip the two
      # publish steps above and leave the landing site stale. continue-on-error
      # keeps a green job when the APK already reached riders.
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.play_bundle != 'true'
        continue-on-error: true
        with:
          name: ${{ steps.config.outputs.stem }}
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Name the Play bundle
        if: github.event.inputs.play_bundle == 'true'
        env:
          VERSION: ${{ steps.config.outputs.version }}
          CODE: ${{ steps.config.outputs.code }}
          AAB: ${{ steps.config.outputs.aab }}
          SUBMIT: ${{ github.event.inputs.submit_to_play }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/play/$AAB"
          size="$(du -h "$RUNNER_TEMP/play/$AAB" | cut -f1)"
          {
            echo "### GRIDGO Rider $VERSION for Google Play"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$AAB\` (in the artifact below) |"
            echo "| versionCode | $CODE |"
            echo "| Size | $size |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Signature | upload key, verified against the keystore alias |"
            echo "| Updates | self-update prompt and side-load links off (Play build) |"
            echo
            if [ "$SUBMIT" = "true" ]; then
              echo "EAS Submit uploads it to the internal testing track below."
            else
              echo "Upload it in Play Console under Testing > Internal testing. Nothing was published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The bundle is the whole point of this run, so a failed upload fails it.
      # An Actions artifact only: never the landing site or a GitHub Release.
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.play_bundle == 'true'
        with:
          name: ${{ steps.config.outputs.stem }}-play
          path: ${{ runner.temp }}/play/*.aab
          if-no-files-found: error
          retention-days: 30

      # Only after the AAB is verified and kept as an artifact, so a failed
      # submission still leaves the bundle to upload by hand. The track and
      # release status live in eas.json (internal, completed) and nowhere else.
      #
      # The service-account key is written outside the workspace, mode 600,
      # and eas.json reads its path from GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH.
      # Its content is never echoed; the trap removes it however the step ends,
      # and the cleanup step below removes it again. eas-cli is pinned, so a
      # new release cannot change what this step uploads.
      #
      # eas submit carries no release notes, so the same key then sets them on
      # that release through Play's edits API and reads them back
      # (scripts/play-release-notes.mjs): the titles of the pull requests since
      # the last release tag, which needs the history the shallow checkout
      # left out. The versionCode is the run number, so each upload is newer.
      - name: Submit the Play bundle to the internal testing track
        if: github.event.inputs.play_bundle == 'true' && github.event.inputs.submit_to_play == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          AAB: ${{ steps.config.outputs.aab }}
          CODE: ${{ steps.config.outputs.code }}
          VERSION: ${{ steps.config.outputs.version }}
          PACKAGE: ${{ steps.config.outputs.package }}
        run: |
          set -euo pipefail
          missing=""
          for name in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            exit 1
          fi

          umask 077
          key="$RUNNER_TEMP/play-service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          chmod 600 "$key"
          unset GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          # Checked quietly: a JSON parse error would quote part of the key.
          if ! node -e '
            try {
              const k = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (k.type !== "service_account" || !k.client_email || !k.private_key) process.exit(1);
            } catch {
              process.exit(1);
            }
          ' "$key" 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a Google service-account key"
            exit 1
          fi
          export GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH="$key"

          npx --yes eas-cli@24.12.1 submit \
            --platform android \
            --profile production \
            --path "$RUNNER_TEMP/play/$AAB" \
            --non-interactive \
            --wait

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow --tags origin
          else
            git fetch --quiet --tags origin
          fi
          notes="$RUNNER_TEMP/play-release-notes.txt"
          PLAY_SERVICE_ACCOUNT_KEY_PATH="$key" \
          PLAY_PACKAGE="$PACKAGE" \
          PLAY_VERSION_CODE="$CODE" \
          PLAY_VERSION="$VERSION" \
            node scripts/play-release-notes.mjs | tee "$notes"

          {
            echo
            echo "Submitted \`$AAB\` (versionCode $CODE) to Google Play's **internal testing** track with EAS Submit."
            echo "Promote it to another track by hand in Play Console."
            echo
            echo '```'
            cat "$notes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key and deploy credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" \
                "$RUNNER_TEMP/google-services.json" \
                "$HOME/.gradle/gradle.properties" \
                "$RUNNER_TEMP/play-service-account.json" \
                "$RUNNER_TEMP/deploy_key" \
                "$RUNNER_TEMP/deploy_known_hosts"
